<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f5f5f5;
        }

        button {
            font-size: 24px;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #counterValue {
            font-size: 48px;
            font-weight: bold;
            margin: 0 20px;
            display: inline-block;
            min-width: 60px;
        }

        #resetBtn {
            font-size: 18px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #increaseBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #decreaseBtn {
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Counter App</h1>

    <button id="decreaseBtn">-</button>
    <span id="counterValue">0</span>
    <button id="increaseBtn">+</button>

    <br><br>

    <button id="resetBtn">Reset</button>

    <script>
        // Step 1: Get all elements from the DOM
        const counterValue = document.getElementById("counterValue");
        const increaseBtn = document.getElementById("increaseBtn");
        const decreaseBtn = document.getElementById("decreaseBtn");
        const resetBtn = document.getElementById("resetBtn");

        // Step 2: Create a function to update the counter color
        function updateCounterColor(value) {
            if (value === 0) {
                counterValue.style.color = "gray";
            } else if (value < 10) {
                counterValue.style.color = "black";
            } else if (value < 20) {
                counterValue.style.color = "green";
            } else {
                counterValue.style.color = "blue";
            }
        }

        // Step 3: Set initial color (0 = gray)
        updateCounterColor(0);

        // Step 4: Increase button logic
        increaseBtn.addEventListener("click", function () {
            // Get current value and convert to number
            let currentValue = Number(counterValue.textContent);
            
            // Increase by 1
            currentValue = currentValue + 1;
            
            // Update the display
            counterValue.textContent = currentValue;
            
            // Update color based on new value
            updateCounterColor(currentValue);
            
            console.log("Counter increased to: " + currentValue);
        });

        // Step 5: Decrease button logic
        decreaseBtn.addEventListener("click", function () {
            // Get current value and convert to number
            let currentValue = Number(counterValue.textContent);
            
            // Check if counter is already at 0
            if (currentValue <= 0) {
                console.log("Counter cannot go below 0");
            } else {
                // Decrease by 1
                currentValue = currentValue - 1;
                
                // Update the display
                counterValue.textContent = currentValue;
                
                // Update color based on new value
                updateCounterColor(currentValue);
                
                console.log("Counter decreased to: " + currentValue);
            }
        });

        // Step 6: Reset button logic
        resetBtn.addEventListener("click", function () {
            // Set counter to 0 directly
            counterValue.textContent = 0;
            
            // Update color to gray (for 0)
            updateCounterColor(0);
            
            console.log("Counter reset to 0");
        });
    </script>
</body>

</html>
