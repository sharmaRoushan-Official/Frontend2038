<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fist DOM</title>
</head>
<body>
    <h1>DOM</h1>
    <p>Welcome to JavaScript</p>
</body>
<script>
    document.querySelector('h1').textContent = 'DOM Manipulation';
    // The webpages changes immediately when the script is executed. The DOM is a live representation of the webpage, and any changes made to it are reflected in real-time.
    console.log(document);
    alert(document.getElementById('title'));
</script>
</html>
